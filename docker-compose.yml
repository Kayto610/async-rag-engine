services: 
  # Service 1 : REDIS (Task Queue & Semantic Cache)
  redis:
    image: redis:7.4-alpine
    container_name: rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # Service 2 : QDRANT (Hybrid Vector Database)
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: rag_qdrant
    restart: unless-stopped
    ports: 
      - "6333:6333"
      - "6334:6334"
    volumes:
    - qdrant_data:/qdrant/storage

# Definisi penyimpanan persistens
volumes:
  redis_data:
  qdrant_data:  